<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Ranking</title>

        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        *{margin:0;padding:0;box-sizing:border-box}

        :root{
            --bg-900:#050807;
            --bg-850:#0a0e0c;
            --bg-800:#0d1713;
            --panel:#0f1916;
            --panel-hi:#14191f;
            --text:#e6f2ec;
            --muted:#8aa29a;
            --muted-strong:#a5bcb2;
            --accent:#5da2b4;
            --accent-strong:#7bc1d4;
            --accent-glow:rgba(123,193,212,0.4);
            --border:rgba(140,180,165,0.18);
            --glass:rgba(12,18,15,0.55);
            --glass-border:rgba(110,200,170,0.2);
            --blur-lg:32px;
            --blur-md:24px;
            --shadow:0 20px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(110,200,170,0.12);
            --shadow-glow:0 0 40px rgba(95,184,146,0.22), inset 0 1px 0 rgba(110,200,170,0.15);
            --radius:20px;
            --transition:all 0.6s cubic-bezier(0.34,1.56,0.64,1);
            --font-display:'Space Grotesk', sans-serif;
            --font-body:'Plus Jakarta Sans', sans-serif;
        }

        body{
            font-family:var(--font-body);
            background:var(--bg-900);
            min-height:100vh;
            padding:24px 20px 60px;
            color:var(--text);
            position:relative;
            overflow-x:hidden;
        }

        body::before{
            content:'';
            position:fixed;
            inset:0;
            background:
                radial-gradient(ellipse 60% 50% at 15% 10%, rgba(93,162,180,0.18) 0%, transparent 70%),
                radial-gradient(ellipse 50% 60% at 85% 85%, rgba(31,106,74,0.22) 0%, transparent 70%),
                linear-gradient(180deg, var(--bg-900), var(--bg-850));
            pointer-events:none;
            z-index:0;
        }

        body::after{
            content:'';
            position:fixed;
            inset:0;
            background-image:
                linear-gradient(rgba(110,200,170,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(110,200,170,0.04) 1px, transparent 1px);
            background-size:64px 64px;
            pointer-events:none;
            z-index:0;
            mask-image:radial-gradient(circle at 50% 40%, black 30%, transparent 75%);
        }

        .nav-bar{
            background:rgba(9,14,12,0.55);
            backdrop-filter:blur(var(--blur-lg)) saturate(180%) brightness(1.08);
            -webkit-backdrop-filter:blur(var(--blur-lg)) saturate(180%) brightness(1.08);
            padding:16px 0;
            position:sticky;
            top:16px;
            z-index:100;
            box-shadow:var(--shadow);
            border:1px solid var(--glass-border);
            border-radius:18px;
        }

        .nav-bar a{
            display:inline-block;
            padding:9px 18px;
            text-decoration:none;
            color:rgba(230,242,236,0.72);
            margin:0 6px;
            border-radius:999px;
            transition:all 0.35s cubic-bezier(0.2,0.9,0.2,1);
            font-size:0.85rem;
            letter-spacing:0.04em;
            font-weight:600;
            text-transform:uppercase;
        }

        .nav-bar a:hover,.nav-bar a.active{
            background:rgba(123,193,212,0.16);
            color:var(--text);
            box-shadow:0 10px 24px rgba(123,193,212,0.2);
        }

        .container{max-width:860px;margin:0 auto;position:relative;z-index:1}

        .rank-header{
            background:var(--glass);
            border-radius:28px;
            padding:34px 32px 30px;
            margin:26px 0;
            box-shadow:var(--shadow);
            text-align:center;
            border:1px solid var(--border);
            backdrop-filter:blur(18px);
        }

        
        .rank-name{font-size:2.1em;font-weight:700;margin-bottom:12px;font-family:var(--font-display)}

        .progress-bar{
            width:100%;
            height:12px;
            background:rgba(255,255,255,0.06);
            border-radius:999px;
            overflow:hidden;
            margin:18px 0 12px;
            border:1px solid rgba(255,255,255,0.06);
        }

        .progress-fill{
            height:100%;
            background:linear-gradient(90deg, var(--accent), var(--accent-strong));
            width:0%;
            transition:width 0.5s ease;
            box-shadow:0 0 18px var(--accent-glow);
        }

        .points-value{
            font-size:2.8em;
            font-weight:700;
            color:var(--text);
            margin-bottom:10px
        }

        .game-area{text-align:center}

        .game-area h1{
            color:var(--text);
            font-size:2.4em;
            margin:30px 0 12px;
            font-family:var(--font-display);
            letter-spacing:-0.02em;
        }

        .streak-info{
            color:var(--muted-strong);
            font-size:1em;
            margin-bottom:24px
        }

        .waste-buttons{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
            gap:18px;
            max-width:700px;
            margin:0 auto
        }

        .waste-btn{
            height:120px;
            border:none;
            border-radius:16px;
            font-size:1rem;
            font-weight:600;
            cursor:pointer;
            transition:all 0.35s cubic-bezier(0.2,0.9,0.2,1);
            box-shadow:0 10px 24px rgba(0,0,0,0.35);
            background:linear-gradient(160deg, rgba(25,38,31,0.9), rgba(19,30,24,0.9));
            color:var(--text);
            border:1px solid rgba(255,255,255,0.06);
        }

        .waste-btn:hover{
            transform:translateY(-6px);
            box-shadow:0 16px 34px rgba(0,0,0,0.45), 0 0 22px rgba(123,193,212,0.2);
            border-color:rgba(123,193,212,0.4)
        }

        @media (max-width:720px){
            .nav-bar{top:0;border-radius:16px}
            .nav-bar a{padding:8px 14px;margin:4px 4px}
            .rank-header{padding:28px 22px}
        }
    </style>
</head>

<body>

<nav class="nav-bar">
    <a href="ranked.html">Dashboard</a>
    <a href="ewaste-ranked.html">E-Waste</a>
    <a href="organic-ranked.html">Organic</a>
    <a href="plastic-ranked.html">Plastic</a>
    <a href="metal-ranked.html">Metal</a>
    <a href="glass-ranked.html" class="active">Glass</a>
</nav>

<div class="container">

    <div class="rank-header">
       
        <div class="rank-name" id="rankName">Iron</div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div id="progressText">0 / 100</div>

        <div class="points-value" id="totalPoints">0</div>
        <div>Glass Points</div>
    </div>

    <div class="game-area">
        <h1>Glass Mastery</h1>
        <div class="streak-info" id="streakInfo">Daily: 0 / 100</div>
        <div class="waste-buttons" id="wasteButtons"></div>
    </div>

</div>

<script>

let streak = 0;
const wasteType = "glass";

const username = localStorage.getItem("username");

// DAILY CAP
let dailyCap = 100;
let dailyPoints = 0;

function fetchDailyCap(){
    fetch(`/get_daily_cap_status?username=${username}`)
    .then(res => res.json())
    .then(data => {
        dailyPoints = data.daily_points_today;
        dailyCap = data.daily_cap;
        updateStreakDisplay();
    })
    .catch(err => console.error(err));
}

const items = [
    {name:'Bottle',points:28,icon:''},
    {name:'Jar',points:22,icon:''},
    {name:'Bulb',points:35,icon:''},
    {name:'Plate',points:25,icon:''},
    {name:'Window',points:45,icon:''}
];

const ranks = {
    'Iron':{min:0,max:99},
    'Bronze':{min:100,max:249},
    'Silver':{min:250,max:499},
    'Gold':{min:500,max:999},
    'Platinum':{min:1000,max:1499},
    'Diamond':{min:1500,max:2499},
    'Ascendant':{min:2500,max:3999},
    'Immortal':{min:4000,max:5999},
    'Radiant':{min:6000}
};

const icons = {
    'Iron':'I','Bronze':'B','Silver':'S','Gold':'G',
    'Platinum':'P','Diamond':'D','Ascendant':'A',
    'Immortal':'IM','Radiant':'R'
};

function getRank(points){
    for(const rank in ranks){
        if(points >= ranks[rank].min && (points <= ranks[rank].max || !ranks[rank].max)){
            return rank;
        }
    }
    return 'Iron';
}

function getNextRank(points){
    const rankOrder = ['Iron','Bronze','Silver','Gold','Platinum','Diamond','Ascendant','Immortal','Radiant'];
    const current = getRank(points);
    const idx = rankOrder.indexOf(current);
    return rankOrder[idx + 1] || null;
}

// Init
function init(){
    createButtons();
    fetchData();
    fetchDailyCap();
}


function createButtons(){
    const container = document.getElementById('wasteButtons');
    container.innerHTML = "";

    items.forEach(item=>{
        const btn = document.createElement('button');
        btn.className = 'waste-btn';
        btn.innerHTML = `${item.icon} ${item.name}`;
        btn.onclick = ()=>attemptDispose(item);
        container.appendChild(btn);
    });
}

// Click Handler
function attemptDispose(item){

    if(dailyPoints >= dailyCap){
        document.getElementById('streakInfo').textContent = "Daily limit reached";
        return;
    }

    streak++;
    addPoints(item.points);
}

function addPoints(points){
    let bonus = (streak > 3 ? Math.floor(streak/3)*5 : 0);
    let total = points + bonus;

    fetch('/api/update_ranking', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            username: localStorage.getItem("username"),
            glass_points: total
        })
    })
    .then(res => {
        if (res.status === 429) {
            return res.json().then(data => {
                document.getElementById('streakInfo').textContent = `Daily cap exceeded. Remaining: ${data.remaining}`;
                fetchDailyCap();
                throw new Error('Daily cap exceeded');
            });
        }
        return res.json();
    })
    .then(data => {
        if (data.success) {
            dailyPoints = data.daily_points_today;
            fetchData();
        }
    })
    .catch(err => console.error(err));
}


function fetchData(){
    fetch('/get_user_data?username=' + localStorage.getItem("username"))
    .then(res => res.json())
    .then(data => {
        const points = data.glass;  // ← glass-specific points
        const rank   = getRank(points);
        const nextRank = getNextRank(points);
        const currentMin = ranks[rank].min;
        const nextMin = nextRank ? ranks[nextRank].min : currentMin;
        const progress = nextRank
            ? Math.min(100, ((points - currentMin) / (nextMin - currentMin)) * 100)
            : 100;

        document.getElementById('totalPoints').textContent  = points;
        document.getElementById('rankName').textContent     = rank;
        
        document.getElementById('progressFill').style.width = progress + "%";
        document.getElementById('progressText').textContent =
            points + " / " + (nextRank ? nextMin : "MAX");
        document.getElementById('streakInfo').textContent   =
            `Streak: ${streak} | Today: ${dailyPoints}/${dailyCap}`;
    })
    .catch(err => console.error(err));
}

// Update streak
function updateStreakDisplay(){
    document.getElementById('streakInfo').textContent = `Streak: ${streak} | Today: ${dailyPoints}/${dailyCap}`;
}



init();

</script>

</body>
</html>
