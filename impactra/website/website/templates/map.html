<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Management - Global Garbage Hotspots</title>
    
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-900:#050807;
            --bg-850:#0a0e0c;
            --panel:#0d1713;
            --panel-hi:#12191a;
            --text:#e7f4ee;
            --muted:#9bb2a8;
            --emerald:#5fb892;
            --emerald-soft:rgba(95,184,146,0.25);
            --border:rgba(110,200,170,0.18);
            --border-glow:rgba(110,200,170,0.35);
            --glass-bg:rgba(12,18,15,0.55);
            --glass-border:rgba(110,200,170,0.2);
            --shadow:0 20px 60px rgba(0,0,0,0.4);
            --shadow-glow:0 0 40px rgba(95,184,146,0.22);
            --blur-lg:32px;
            --blur-md:24px;
            --radius:20px;
            --transition:all 0.6s cubic-bezier(0.34,1.56,0.64,1);
            --font-display:'Space Grotesk', sans-serif;
            --font-body:'Plus Jakarta Sans', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-body);
            background: var(--bg-900);
            height: 100vh;
            overflow: hidden;
            color: var(--text);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 15% 10%, rgba(95,184,146,0.22) 0%, transparent 70%),
                radial-gradient(ellipse 50% 60% at 85% 85%, rgba(31,106,74,0.22) 0%, transparent 70%),
                linear-gradient(180deg, var(--bg-900), var(--bg-850));
            pointer-events: none;
            z-index: 0;
        }

        .header {
            background: rgba(9, 14, 12, 0.82);
            color: var(--text);
            padding: 18px 30px 14px;
            text-align: center;
            box-shadow: var(--shadow);
            position: relative;
            z-index: 1000;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(18px);
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
            font-family: var(--font-display);
            letter-spacing: -0.02em;
        }

        .header p {
            margin-top: 6px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .controls {
            position: absolute;
            top: 90px;
            right: 24px;
            background: rgba(15, 25, 21, 0.85);
            padding: 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            z-index: 1000;
            border: 1px solid var(--border);
            backdrop-filter: blur(16px);
        }

        .control-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 6px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        select, input[type="range"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            font-size: 13px;
            background: rgba(10, 16, 14, 0.9);
            color: var(--text);
        }

        #severityValue {
            display: inline-block;
            margin-top: 6px;
            color: var(--muted);
            font-size: 12px;
        }

        #map {
            height: calc(100vh - 110px);
            width: 100%;
            z-index: 1;
        }

        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 25, 21, 0.85);
            padding: 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            z-index: 1000;
            border: 1px solid var(--border);
            backdrop-filter: blur(16px);
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
            color: var(--muted);
        }

        .legend-color {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            margin-right: 8px;
        }

        .info-window {
            padding: 12px;
            background: #0f1713;
            border-radius: 12px;
            box-shadow: 0 10px 24px rgba(0,0,0,0.35);
            max-width: 350px;
            color: var(--text);
        }

        .hotspot-title {
            font-weight: 700;
            color: #f08d76;
            margin-bottom: 5px;
            font-size: 15px;
        }

        .hotspot-details {
            font-size: 13px;
            line-height: 1.5;
            color: var(--muted);
        }

        .country-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            margin-top: 5px;
        }

        .india { background: #f28c4d; color: #0f1713; }
        .pakistan { background: #5aa8d4; color: #0f1713; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Global Waste Management Dashboard</h1>
        <p>View Garbage Hotspots | Real-time monitoring</p>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Layer View:</label>
            <select id="layerSelect">
                <option value="countries">Countries</option>
                <option value="states">States/Provinces</option>
                <option value="hotspots">All Hotspots</option>
                <option value="india">India Only</option>
                
                <option value="southasia">South Asia Focus</option>
            </select>
        </div>
        <div class="control-group">
            <label>Hotspot Severity:</label>
            <input type="range" id="severityFilter" min="1" max="5" value="5">
            <span id="severityValue">Max Severity</span>
        </div>
    </div>

    <div id="map"></div>

    <div class="legend">
        <div style="font-weight: bold; margin-bottom: 10px;">Hotspot Severity</div>
        <div class="legend-item">
            <div class="legend-color" style="background: #ff0000;"></div>
            <span>Critical (5) - Emergency</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #ff6600;"></div>
            <span>High (4) - Urgent</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #ffcc00;"></div>
            <span>Medium (3)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #00ff00;"></div>
            <span>Low (2)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #00ccff;"></div>
            <span>Minor (1)</span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Map initialize
        const map = L.map('map').setView([23, 78], 5);

        // open street map tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Layer groups
        const hotspots = L.layerGroup();
        const indiaHotspots = L.layerGroup();
        const pakistanHotspots = L.layerGroup();

        // hotspot data
        const hotspotData = [
            
            {lat: 22.32, lng: 114.17, name: "Hong Kong Landfill", severity: 5, type: "Landfill Overflow", country: "China"},
            {lat: -33.86, lng: 151.20, name: "Sydney Waste Site", severity: 5, type: "Illegal Dumping", country: "Australia"},
            
            
            {lat: 28.61, lng: 77.23, name: "Delhi - Ghazipur Landfill", severity: 5, type: "Landfill Fire Hazard", country: "India"},
            {lat: 28.66, lng: 77.22, name: "Delhi - Okhla Landfill", severity: 4, type: "Leachate Overflow", country: "India"},
            {lat: 28.53, lng: 77.26, name: "Delhi - Bhalswa Landfill", severity: 5, type: "Toxic Smoke", country: "India"},
            {lat: 19.07, lng: 72.87, name: "Mumbai - Deonar Dumping Ground", severity: 4, type: "Massive Fire", country: "India"},
            {lat: 19.05, lng: 72.88, name: "Mumbai - Kanjurmarg", severity: 3, type: "Overcapacity", country: "India"},
            {lat: 22.57, lng: 88.36, name: "Kolkata - Dhapa Dumping Ground", severity: 4, type: "Open Burning", country: "India"},
            {lat: 12.97, lng: 77.59, name: "Bengaluru - Bellandur Lake", severity: 5, type: "Foam Fire Disaster", country: "India"},
            {lat: 13.08, lng: 80.27, name: "Chennai - Kodungaiyur", severity: 4, type: "Coastal Pollution", country: "India"},
            {lat: 26.85, lng: 80.94, name: "Lucknow - Shahu Nagar", severity: 3, type: "Mixed Waste", country: "India"},
            {lat: 23.02, lng: 72.57, name: "Ahmedabad - Pirana", severity: 4, type: "Landfill Collapse", country: "India"},
            {lat: 17.38, lng: 78.47, name: "Hyderabad - Jawaharnagar", severity: 3, type: "Vector Breeding", country: "India"},
            {lat: 31.63, lng: 74.87, name: "Amritsar - Majra Landfill", severity: 3, type: "Border Area Waste", country: "India"},
            {lat: 22.30, lng: 70.80, name: "Jamnagar - Khodiyar", severity: 2, type: "Industrial Waste", country: "India"},
            {lat: 16.70, lng: 74.01, name: "Belagavi - Khanapur Road", severity: 3, type: "Urban Dumping", country: "India"},
            {lat: 30.71, lng: 76.72, name: "Chandigarh - Dumping Site", severity: 2, type: "Planned City Waste", country: "India"},
            
            
            {lat: 28.38, lng: 77.32, name: "Noida - Industrial Waste", severity: 4, type: "E-Waste Dumping", country: "India"},
            {lat: 22.99, lng: 72.60, name: "Vatva GIDC - Chemical Waste", severity: 5, type: "Hazardous Spill", country: "India"},
            
            
            {lat: 24.86, lng: 67.00, name: "Karachi - Gond Pass Landfill", severity: 5, type: "Methane Explosions", country: "Pakistan"},
            {lat: 24.90, lng: 67.03, name: "Karachi - Jam Chakro", severity: 4, type: "Sea Turtle Threat", country: "Pakistan"},
            {lat: 24.86, lng: 67.15, name: "Karachi - Mehmoodabad", severity: 4, type: "Child Labor Scavenging", country: "Pakistan"},
            {lat: 33.68, lng: 73.04, name: "Islamabad - Khatam-e-Nabuwat", severity: 3, type: "Capital Waste", country: "Pakistan"},
            {lat: 31.58, lng: 74.35, name: "Lahore - Ganganagar", severity: 4, type: "Ravi River Pollution", country: "Pakistan"},
            {lat: 31.57, lng: 74.28, name: "Lahore - Sajeel Nagar", severity: 3, type: "Burning Piles", country: "Pakistan"},
            {lat: 30.19, lng: 71.43, name: "Multan - Basti Malook", severity: 3, type: "Cotton Waste", country: "Pakistan"},
            {lat: 34.00, lng: 71.57, name: "Peshawar - Hayatsabad", severity: 4, type: "Refugee Area Waste", country: "Pakistan"},
            {lat: 25.40, lng: 68.35, name: "Hyderabad - Hala Naka", severity: 3, type: "Sindh Rural Waste", country: "Pakistan"},
            {lat: 29.38, lng: 71.68, name: "Bahawalpur - Industrial Dump", severity: 2, type: "Textile Waste", country: "Pakistan"},
            {lat: 28.40, lng: 70.30, name: "Rahim Yar Khan - Desert Dump", severity: 3, type: "Open Desert Burning", country: "Pakistan"},
            
            
            {lat: 24.90, lng: 67.10, name: "Karachi - SITE Industrial", severity: 4, type: "Tannery Waste", country: "Pakistan"},
            {lat: 31.60, lng: 74.40, name: "Lahore - Kot Lakhpat", severity: 4, type: "E-Waste Processing", country: "Pakistan"}
        ];

        // circular markers
        hotspotData.forEach(hotspot => {
            const severityColors = ['#00ccff', '#00ff00', '#ffcc00', '#ff6600', '#ff0000'];
            const color = severityColors[hotspot.severity - 1];
            const radius = 10 + (hotspot.severity * 4);
            
            const marker = L.circleMarker([hotspot.lat, hotspot.lng], {
                radius: radius,
                fillColor: color,
                color: '#000',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.85
            }).bindPopup(`
                <div class="info-window">
                    <div class="hotspot-title">${hotspot.name}</div>
                    <div class="hotspot-details">
                        <strong>Severity:</strong> ${'★'.repeat(hotspot.severity)}${'☆'.repeat(5-hotspot.severity)} (${hotspot.severity}/5)<br>
                        <strong>Issue:</strong> ${hotspot.type}<br>
                        <strong>Region:</strong> ${hotspot.country}
                        <div class="country-badge ${hotspot.country.toLowerCase()}">${hotspot.country}</div>
                    </div>
                    <div style="margin-top: 8px; font-size: 12px; color: #666;">
                        Priority: ${hotspot.severity >= 4 ? 'IMMEDIATE' : hotspot.severity >= 3 ? 'URGENT' : 'SCHEDULED'}
                    </div>
                </div>
            `);
            
            hotspots.addLayer(marker);
            
           
            if (hotspot.country === 'India') {
                indiaHotspots.addLayer(marker);
            } else if (hotspot.country === 'Pakistan') {
                pakistanHotspots.addLayer(marker);
            }
        });

        
        const overlayLayers = {
            "All Hotspots": hotspots,
            "India (25+)": indiaHotspots,
            "Pakistan (15+)": pakistanHotspots
        };

        L.control.layers(overlayLayers).addTo(map);
        hotspots.addTo(map); // Add all by default

        // Enhanced control handlers
        document.getElementById('layerSelect').addEventListener('change', function(e) {
            // Clear all overlay layers
            map.eachLayer(function(layer) {
                if (layer === hotspots || layer === indiaHotspots || layer === pakistanHotspots) {
                    map.removeLayer(layer);
                }
            });
            
            if (e.target.value === 'countries') {
                // Add country layer logic here
            } else if (e.target.value === 'india') {
                map.addLayer(indiaHotspots);
                map.setView([22, 78], 6);
            } else if (e.target.value === 'pakistan') {
                map.addLayer(pakistanHotspots);
                map.setView([28, 70], 7);
            } else if (e.target.value === 'southasia') {
                map.addLayer(hotspots);
                map.setView([23, 78], 5);
            } else if (e.target.value === 'hotspots') {
                map.addLayer(hotspots);
            }
        });

        // Severity filter
        document.getElementById('severityFilter').addEventListener('input', function(e) {
            const maxSeverity = parseInt(e.target.value);
            document.getElementById('severityValue').textContent = `Max Severity ${maxSeverity}`;
            
            hotspots.eachLayer(function(marker) {
                const severity = Math.round((marker.options.radius - 10) / 4);
                if (severity > maxSeverity) {
                    if (map.hasLayer(marker)) map.removeLayer(marker);
                } else {
                    if (!map.hasLayer(marker)) map.addLayer(marker);
                }
            });
        });

        // cluster 
        const markersCluster = L.markerClusterGroup();
        hotspots.eachLayer(marker => markersCluster.addLayer(marker));
        map.addLayer(markersCluster);

        
        map.on('click', function(e) {
            L.popup()
                .setLatLng(e.latlng)
                .setContent(`Coordinates: ${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`)
                .openOn(map);
        });
    </script>
</body>
</html>
