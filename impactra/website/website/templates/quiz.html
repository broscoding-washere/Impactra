<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SDG Knowledge Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green-dark:   #1b5a40;
    --green-mid:    #5fb892;
    --green-light:  #7fd2b3;
    --green-pale:   #c9f2de;
    --white:        #e7f4ee;
    --text-dark:    #e7f4ee;
    --text-muted:   #9bb2a8;
    --green-ok:     #5fb892;
    --green-bg:     #0f1713;
    --red-err:      #d46f63;
    --red-bg:       #2a1210;
    --glass-bg:     rgba(12, 18, 15, 0.55);
    --glass-border: rgba(110, 200, 170, 0.2);
    --blur-lg:      32px;
    --blur-md:      24px;
    --radius-card:  28px;
    --radius-opt:   16px;
    --shadow-card:  0 20px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(110, 200, 170, 0.12);
    --shadow-glow:  0 0 40px rgba(95, 184, 146, 0.22), inset 0 1px 0 rgba(110, 200, 170, 0.15);
    --transition:   all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  html, body {
    min-height: 100%;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(180deg, #050807 0%, #0b110f 55%, #070b0a 100%);
    background-attachment: fixed;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 50px 20px 70px;
    min-height: 100vh;
    cursor: none;
    scroll-behavior: smooth;
  }

  /* ── Header ── */
  .site-header {
    text-align: center;
    margin-bottom: 40px;
    animation: fadeDown 0.6s ease-out both;
  }

  .site-header .sdg-label {
    display: inline-block;
    background: rgba(167, 243, 208, 0.2);
    color: #a7f3d0;
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 7px 18px;
    border-radius: 99px;
    margin-bottom: 14px;
    border: 1px solid rgba(167, 243, 208, 0.4);
    backdrop-filter: blur(10px);
  }

  .site-header h1 {
    font-family: 'Poppins', sans-serif;
    font-size: clamp(28px, 6vw, 42px);
    color: #f0fdf4;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .site-header p {
    color: var(--text-muted);
    font-size: 1rem;
    margin-top: 10px;
    font-weight: 400;
    opacity: 0.9;
  }

  /* ── Card ── */
  .quiz-card {
    background: rgba(15, 25, 21, 0.85);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    width: 100%;
    max-width: 700px;
    padding: 42px 40px 38px;
    animation: fadeUp 0.6s ease-out both 0.1s;
    border: 1px solid rgba(110, 200, 170, 0.18);
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(16px);
  }

  /* ── Progress ── */
  .quiz-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 30px;
  }

  .progress-track {
    flex: 1;
    height: 6px;
    background: rgba(167, 243, 208, 0.25);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #047857 0%, #059669 100%);
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.23, 1, 0.32, 1);
  }

  .q-label {
    font-size: 11px;
    font-weight: 650;
    color: var(--text-muted);
    white-space: nowrap;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .score-pill {
    background: linear-gradient(135deg, rgba(95, 184, 146, 0.15) 0%, rgba(127, 210, 179, 0.1) 100%);
    color: var(--white);
    font-size: 11px;
    font-weight: 650;
    padding: 6px 14px;
    border-radius: 99px;
    white-space: nowrap;
    border: 1px solid rgba(95, 184, 146, 0.35);
    letter-spacing: 0.3px;
  }

  /* ── SDG Tag ── */
  .sdg-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, rgba(95, 184, 146, 0.18) 0%, rgba(127, 210, 179, 0.14) 100%);
    color: var(--white);
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 10px;
    margin-bottom: 18px;
    border: 1px solid rgba(95, 184, 146, 0.4);
  }

  .sdg-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, #047857 0%, #059669 100%);
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(4, 120, 87, 0.3);
  }

  /* ── Question ── */
  .question-text {
    font-family: 'Poppins', sans-serif;
    font-size: clamp(18px, 3.5vw, 22px);
    color: var(--text-dark);
    line-height: 1.6;
    margin-bottom: 28px;
    font-weight: 650;
    min-height: 60px;
  }

  /* ── Options ── */
  .options-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .opt-btn {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    border: 1.5px solid rgba(110, 200, 170, 0.2);
    border-radius: var(--radius-opt);
    background: rgba(12, 20, 16, 0.85);
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
    font-size: 1rem;
    color: var(--white);
    text-align: left;
    transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
    outline: none;
    width: 100%;
    font-weight: 500;
  }

  .opt-btn:hover:not(:disabled) {
    border-color: rgba(95, 184, 146, 0.6);
    background: rgba(18, 32, 26, 0.9);
    transform: translateX(6px);
    box-shadow: 0 4px 12px rgba(95, 184, 146, 0.15);
  }

  .opt-btn:active:not(:disabled) {
    transform: translateX(4px) scale(0.98);
  }

  .opt-letter {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1.5px solid rgba(110, 200, 170, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 650;
    color: var(--text-muted);
    flex-shrink: 0;
    transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
    background: rgba(10, 16, 14, 0.6);
  }

  .opt-btn.correct {
    background: rgba(17, 34, 28, 0.9);
    border-color: #5fb892;
    box-shadow: 0 4px 12px rgba(95, 184, 146, 0.2);
  }

  .opt-btn.correct .opt-letter {
    background: #5fb892;
    border-color: #5fb892;
    color: #0f1915;
    box-shadow: 0 2px 8px rgba(95, 184, 146, 0.3);
  }

  .opt-btn.wrong {
    background: rgba(42, 18, 16, 0.9);
    border-color: #d46f63;
    box-shadow: 0 4px 12px rgba(212, 111, 99, 0.2);
  }

  .opt-btn.wrong .opt-letter {
    background: #d46f63;
    border-color: #d46f63;
    color: #0f1915;
    box-shadow: 0 2px 8px rgba(212, 111, 99, 0.2);
  }

  .opt-btn.reveal {
    background: rgba(17, 34, 28, 0.85);
    border-color: #5fb892;
    opacity: 0.8;
  }

  .opt-btn.reveal .opt-letter {
    background: #5fb892;
    border-color: #5fb892;
    color: #0f1915;
  }

  /* ── Feedback ── */
  .feedback {
    margin-top: 18px;
    min-height: 20px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 550;
  }

  .fb-icon {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
  }

  .feedback.ok .fb-icon {
    background: #047857;
    color: #fff;
    box-shadow: 0 2px 6px rgba(4, 120, 87, 0.3);
  }

  .feedback.ok {
    color: #7fd2b3;
  }

  .feedback.bad .fb-icon {
    background: #c0392b;
    color: #fff;
    box-shadow: 0 2px 6px rgba(192, 57, 43, 0.2);
  }

  .feedback.bad {
    color: #d46f63;
  }

  /* ── Footer row ── */
  .footer-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 26px;
  }

  .next-btn {
    background: linear-gradient(135deg, #7fd2b3 0%, #5fb892 100%);
    color: #0f1915;
    border: none;
    padding: 12px 30px;
    border-radius: 99px;
    font-family: 'Poppins', sans-serif;
    font-size: 1rem;
    font-weight: 650;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
    display: none;
    letter-spacing: 0.3px;
    box-shadow: 0 8px 20px rgba(95, 184, 146, 0.3);
  }

  .next-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(4, 120, 87, 0.35);
  }

  .next-btn:active:not(:disabled) {
    transform: translateY(0px);
  }

  .next-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* ── Result ── */
  .result-screen {
    display: none;
    text-align: center;
    padding: 12px 0 8px;
  }

  .result-circle {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    margin: 0 auto 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    font-size: 36px;
    line-height: 1;
    font-weight: 700;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
  }

  .result-circle span.sub {
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.5px;
    margin-top: 5px;
    text-transform: uppercase;
  }

  .rc-great {
    background: #dcfce7;
    color: #047857;
  }

  .rc-ok {
    background: #fef3c7;
    color: #92400e;
  }

  .rc-low {
    background: #fde8e6;
    color: #c0392b;
  }

  .result-title {
    font-family: 'Poppins', sans-serif;
    font-size: 26px;
    color: var(--text-dark);
    margin-bottom: 10px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .result-sub {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.7;
    margin-bottom: 28px;
    font-weight: 400;
  }

  .result-actions {
    display: flex;
    gap: 14px;
    justify-content: center;
  }

  .btn-restart {
    padding: 12px 32px;
    border-radius: 99px;
    font-family: 'Poppins', sans-serif;
    font-size: 1rem;
    font-weight: 650;
    cursor: pointer;
    background: linear-gradient(135deg, #7fd2b3 0%, #5fb892 100%);
    color: #0f1915;
    border: none;
    transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
    letter-spacing: 0.3px;
    box-shadow: 0 8px 20px rgba(95, 184, 146, 0.3);
  }

  .btn-restart:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(4, 120, 87, 0.35);
  }

  .btn-restart:active {
    transform: translateY(0px);
  }

  /* ── Divider ── */
  .divider {
    border: none;
    border-top: 1px solid rgba(167, 243, 208, 0.25);
    margin: 26px 0 0;
  }

  /* ── Animations ── */
  @keyframes fadeDown {
    from {
      opacity: 0;
      transform: translateY(-20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(25px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Custom Cursor */
  .cursor {
    position: fixed;
    width: 20px;
    height: 20px;
    background: rgba(167, 243, 208, 0.6);
    border: 2px solid rgba(167, 243, 208, 0.8);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transition: transform 0.15s ease, width 0.15s ease, height 0.15s ease;
    backdrop-filter: blur(8px);
  }

  .cursor.grow {
    transform: scale(1.8);
    width: 24px;
    height: 24px;
    background: rgba(167, 243, 208, 0.4);
  }

  /* Scrollbar styling */
  ::-webkit-scrollbar {
    width: 10px;
  }

  ::-webkit-scrollbar-track {
    background: rgba(4, 120, 87, 0.05);
  }

  ::-webkit-scrollbar-thumb {
    background: rgba(4, 120, 87, 0.3);
    border-radius: 8px;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: rgba(4, 120, 87, 0.5);
  }

  @media (max-width: 768px) {
    body {
      padding: 35px 16px 55px;
    }

    .site-header {
      margin-bottom: 32px;
    }

    .quiz-card {
      padding: 32px 28px 28px;
      max-width: 100%;
    }

    .opt-btn {
      padding: 14px 16px;
      gap: 12px;
    }

    .opt-letter {
      width: 30px;
      height: 30px;
      font-size: 11px;
    }
  }

  @media (max-width: 480px) {
    body {
      padding: 28px 14px 48px;
    }

    .site-header h1 {
      font-size: 24px;
    }

    .site-header p {
      font-size: 0.95rem;
    }

    .quiz-card {
      padding: 24px 20px 22px;
      border-radius: 20px;
    }

    .quiz-meta {
      flex-direction: column;
      gap: 12px;
      align-items: stretch;
    }

    .progress-track {
      order: -1;
    }

    .question-text {
      font-size: 16px;
      margin-bottom: 20px;
    }

    .opt-btn {
      padding: 12px 14px;
      font-size: 0.95rem;
    }

    .next-btn {
      width: 100%;
      padding: 12px 20px;
    }

    .result-circle {
      width: 90px;
      height: 90px;
      font-size: 28px;
    }

    .result-title {
      font-size: 22px;
    }

    .btn-restart {
      width: 100%;
      padding: 12px 20px;
    }
  }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>

<header class="site-header">
  <div class="sdg-label">United Nations · 2030 Agenda</div>
  <h1>SDG Knowledge Quiz</h1>
  <p>Test your knowledge across all 17 Sustainable Development Goals</p>
</header>

<div class="quiz-card" id="quizCard">
  <!-- Main quiz view -->
  <div id="mainView">
    <div class="quiz-meta">
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <span class="q-label" id="qLabel">1 / 10</span>
      <span class="score-pill" id="scorePill">0 / 10</span>
    </div>
    <div class="sdg-tag"><span class="sdg-dot"></span><span id="sdgTag">SDG 1</span></div>
    <p class="question-text" id="questionText">Loading…</p>
    <div class="options-grid" id="optionsGrid"></div>
    <div class="feedback" id="feedbackBar"></div>
    <hr class="divider" />
    <div class="footer-row">
      <button class="next-btn" id="nextBtn">Next →</button>
    </div>
  </div>

  <!-- Result screen -->
  <div class="result-screen" id="resultScreen">
    <div class="result-circle" id="resultCircle"></div>
    <p class="result-title" id="resultTitle"></p>
    <p class="result-sub"   id="resultSub"></p>
    <div class="result-actions">
      <button class="btn-restart" onclick="initQuiz()">Play Again</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
//  100 SDG QUESTIONS — 5–6 per goal (SDG 1–17)
// ─────────────────────────────────────────────
const ALL_QUESTIONS = [
  // SDG 1 — No Poverty
  { sdg:1, q:"What percentage of the world's population lived in extreme poverty in 2023?", opts:["About 8%","About 20%","About 35%","About 50%"], ans:"About 8%" },
  { sdg:1, q:"The international extreme poverty line is set at income below ____ per day (2017 PPP).", opts:["$1.90","$2.15","$3.00","$5.00"], ans:"$2.15" },
  { sdg:1, q:"Which SDG goal specifically aims to end poverty in all its forms everywhere?", opts:["SDG 2","SDG 1","SDG 10","SDG 3"], ans:"SDG 1" },
  { sdg:1, q:"Which region has the highest concentration of people living in extreme poverty?", opts:["South Asia","Latin America","Sub-Saharan Africa","East Asia"], ans:"Sub-Saharan Africa" },
  { sdg:1, q:"Social protection systems are highlighted in SDG 1 to cover the poor and the ____.", opts:["Elderly only","Vulnerable","Employed","Wealthy"], ans:"Vulnerable" },
  { sdg:1, q:"SDG 1 calls for ending extreme poverty for all people everywhere by which year?", opts:["2025","2030","2035","2040"], ans:"2030" },

  // SDG 2 — Zero Hunger
  { sdg:2, q:"Approximately how many people were undernourished globally in 2022?", opts:["100 million","400 million","735 million","1 billion"], ans:"735 million" },
  { sdg:2, q:"What does SDG 2 primarily aim to achieve?", opts:["Zero pollution","Zero Hunger","Zero waste","Zero deforestation"], ans:"Zero Hunger" },
  { sdg:2, q:"Which practice is promoted in SDG 2 to ensure long-term food security?", opts:["Monoculture farming","Sustainable agriculture","Urban mining","Deep-sea fishing"], ans:"Sustainable agriculture" },
  { sdg:2, q:"Stunting in children is primarily caused by chronic ____.", opts:["Malnutrition","Dehydration","Pollution","Obesity"], ans:"Malnutrition" },
  { sdg:2, q:"SDG 2 calls for doubling the agricultural productivity of small-scale ____.", opts:["Corporations","Food producers","Governments","NGOs"], ans:"Food producers" },
  { sdg:2, q:"Which global initiative under SDG 2 supports seed diversity and agro-biodiversity?", opts:["Paris Agreement","Svalbard Global Seed Vault","Kyoto Protocol","CITES"], ans:"Svalbard Global Seed Vault" },

  // SDG 3 — Good Health and Well-being
  { sdg:3, q:"What does SDG 3 aim to ensure for all people of all ages?", opts:["Employment","Healthy lives and well-being","Free education","Clean water"], ans:"Healthy lives and well-being" },
  { sdg:3, q:"Universal Health Coverage (UHC) is a key target under which SDG?", opts:["SDG 1","SDG 4","SDG 3","SDG 10"], ans:"SDG 3" },
  { sdg:3, q:"SDG 3 includes a target to end the epidemic of AIDS, tuberculosis, malaria and ____.", opts:["Diabetes","Neglected tropical diseases","Cancer","Hypertension"], ans:"Neglected tropical diseases" },
  { sdg:3, q:"By 2030, SDG 3 aims to reduce the global maternal mortality ratio to fewer than ____ per 100,000 live births.", opts:["70","150","200","300"], ans:"70" },
  { sdg:3, q:"Which disease was declared eradicated globally, a success celebrated under health goals?", opts:["Polio","Smallpox","Measles","Cholera"], ans:"Smallpox" },
  { sdg:3, q:"Tobacco use is specifically addressed under SDG 3 through implementation of the ____ Framework Convention.", opts:["WHO FCTC","UNFCCC","Basel Convention","Rotterdam Convention"], ans:"WHO FCTC" },

  // SDG 4 — Quality Education
  { sdg:4, q:"SDG 4 aims to ensure inclusive and equitable quality education and promote ____ learning opportunities.", opts:["Lifelong","Online","Competitive","Private"], ans:"Lifelong" },
  { sdg:4, q:"What percentage of children globally lack basic reading and mathematics skills by end of primary school?", opts:["10%","30%","50%","70%"], ans:"50%" },
  { sdg:4, q:"Which target of SDG 4 focuses on pre-primary education?", opts:["4.1","4.2","4.5","4.7"], ans:"4.2" },
  { sdg:4, q:"SDG 4 emphasizes that all girls and boys should complete free, equitable, and quality primary and secondary education resulting in relevant ____.", opts:["Employment","Learning outcomes","Certificates","Scholarships"], ans:"Learning outcomes" },
  { sdg:4, q:"The Education for Sustainable Development (ESD) initiative supports which SDG?", opts:["SDG 13","SDG 4","SDG 8","SDG 17"], ans:"SDG 4" },
  { sdg:4, q:"Gender parity in education is a specific target under SDG ____.", opts:["5","4","3","10"], ans:"4" },

  // SDG 5 — Gender Equality
  { sdg:5, q:"SDG 5 focuses on achieving gender equality and empowering all ____ and girls.", opts:["Children","Women","Elderly","Workers"], ans:"Women" },
  { sdg:5, q:"Which harmful practice is targeted for elimination under SDG 5?", opts:["Child marriage","Deforestation","Fossil fuel use","Ocean pollution"], ans:"Child marriage" },
  { sdg:5, q:"What share of parliamentary seats were held by women globally as of 2023?", opts:["About 10%","About 26%","About 40%","About 50%"], ans:"About 26%" },
  { sdg:5, q:"Unpaid care and domestic work recognition is addressed in which SDG target?", opts:["5.1","5.4","5.5","5.a"], ans:"5.4" },
  { sdg:5, q:"SDG 5 calls for women's full and effective participation and equal opportunities for ____ at all levels.", opts:["Sport","Leadership","Education","Housing"], ans:"Leadership" },
  { sdg:5, q:"Technology access for women is emphasised under which SDG 5 target?", opts:["5.a","5.b","5.c","5.6"], ans:"5.b" },

  // SDG 6 — Clean Water and Sanitation
  { sdg:6, q:"How many people globally lacked access to safely managed drinking water as of 2022?", opts:["500 million","1 billion","2.2 billion","4 billion"], ans:"2.2 billion" },
  { sdg:6, q:"SDG 6 aims to achieve universal access to safe and affordable ____ for all.", opts:["Housing","Drinking water","Internet","Food"], ans:"Drinking water" },
  { sdg:6, q:"Open defecation is a sanitation issue specifically addressed under SDG ____.", opts:["3","6","11","13"], ans:"6" },
  { sdg:6, q:"Which target under SDG 6 focuses on protecting and restoring water-related ecosystems?", opts:["6.1","6.3","6.6","6.b"], ans:"6.6" },
  { sdg:6, q:"Water-use efficiency improvements are called for in SDG 6 target ____.", opts:["6.1","6.4","6.5","6.2"], ans:"6.4" },
  { sdg:6, q:"Integrated Water Resources Management (IWRM) is referenced in SDG 6 target ____.", opts:["6.5","6.1","6.3","6.b"], ans:"6.5" },

  // SDG 7 — Affordable and Clean Energy

// ─────────────────────────────────────────────
//  QUIZ ENGINE
// ─────────────────────────────────────────────
const SDG_NAMES = {
  1:"No Poverty", 2:"Zero Hunger", 3:"Good Health & Well-being",
  4:"Quality Education", 5:"Gender Equality", 6:"Clean Water & Sanitation",
  7:"Affordable & Clean Energy", 8:"Decent Work & Economic Growth",
  9:"Industry, Innovation & Infrastructure", 10:"Reduced Inequalities",
  11:"Sustainable Cities & Communities", 12:"Responsible Consumption & Production",
  13:"Climate Action", 14:"Life Below Water", 15:"Life on Land",
  16:"Peace, Justice & Strong Institutions", 17:"Partnerships for the Goals"
};

let questions, idx, score, answered;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initQuiz() {
  questions = shuffle(ALL_QUESTIONS).slice(0, 10);
  idx = 0; score = 0; answered = false;
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('mainView').style.display = 'block';
  document.getElementById('scorePill').textContent = '0 / 10';
  document.getElementById('feedbackBar').innerHTML = '';
  document.getElementById('nextBtn').style.display = 'none';
  loadQuestion();
}

function loadQuestion() {
  answered = false;
  const q = questions[idx];
  const total = questions.length;

  document.getElementById('qLabel').textContent = `${idx + 1} / ${total}`;
  document.getElementById('progressFill').style.width = `${(idx / total) * 100}%`;
  document.getElementById('sdgTag').textContent = `SDG ${q.sdg} — ${SDG_NAMES[q.sdg]}`;
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('feedbackBar').innerHTML = '';
  document.getElementById('nextBtn').style.display = 'none';

  const opts = shuffle(q.opts);
  const letters = ['A','B','C','D'];
  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = '';
  opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${opt}</span>`;
    btn.addEventListener('click', () => selectAnswer(opt, q.ans));
    grid.appendChild(btn);
  });
}

function selectAnswer(selected, correct) {
  if (answered) return;
  answered = true;
  const isCorrect = selected === correct;
  const btns = document.querySelectorAll('.opt-btn');
  const fb = document.getElementById('feedbackBar');

  btns.forEach(btn => {
    btn.disabled = true;
    const label = btn.querySelector('span:last-child').textContent;
    if (label === correct && !isCorrect) btn.classList.add('reveal');
    if (label === selected) btn.classList.add(isCorrect ? 'correct' : 'wrong');
  });

  if (isCorrect) {
    score++;
    document.getElementById('scorePill').textContent = `${score} / 10`;
    fb.className = 'feedback ok';
    fb.innerHTML = `<span class="fb-icon">✓</span><span>Correct!</span>`;
  } else {
    fb.className = 'feedback bad';
    fb.innerHTML = `<span class="fb-icon">✗</span><span>Incorrect — correct answer: <strong>${correct}</strong></span>`;
  }

  const nb = document.getElementById('nextBtn');
  nb.style.display = 'block';
  nb.textContent = idx < questions.length - 1 ? 'Next →' : 'See Results';
}

document.getElementById('nextBtn').addEventListener('click', () => {
  idx++;
  if (idx < questions.length) loadQuestion();
  else showResult();
});

function showResult() {
  document.getElementById('mainView').style.display = 'none';
  const rs = document.getElementById('resultScreen');
  rs.style.display = 'block';

  const pct = score / questions.length;
  const ring = document.getElementById('resultCircle');
  ring.innerHTML = `${score}<span class="sub">out of 10</span>`;
  if (pct >= 0.8)       { ring.className = 'result-circle rc-great'; document.getElementById('resultTitle').textContent = 'Excellent work!'; }
  else if (pct >= 0.5)  { ring.className = 'result-circle rc-ok';    document.getElementById('resultTitle').textContent = 'Good effort!'; }
  else                  { ring.className = 'result-circle rc-low';   document.getElementById('resultTitle').textContent = 'Keep learning!'; }

  document.getElementById('resultSub').textContent =
    `You scored ${score} out of 10 questions. The quiz covered ${[...new Set(questions.map(q=>q.sdg))].map(s=>`SDG ${s}`).join(', ')}.`;
}

initQuiz();

// Custom Cursor
const cursor = document.getElementById('cursor');
document.addEventListener('mousemove', (e) => {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top = e.clientY + 'px';
});

document.querySelectorAll('button, a, input, select, textarea').forEach(el => {
  el.addEventListener('mouseenter', () => cursor.classList.add('grow'));
  el.addEventListener('mouseleave', () => cursor.classList.remove('grow'));
});

// Click ripple effect
document.addEventListener('click', (e) => {
  if (e.target.closest('nav a, button')) return; // Skip ripple on nav/buttons
  
  const ripple = document.createElement('div');
  ripple.style.cssText = `
    position: fixed;
    left: ${e.clientX}px;
    top: ${e.clientY}px;
    width: 10px;
    height: 10px;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 9998;
    animation: ripple 0.6s ease-out forwards;
  `;
  document.body.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
});

// Add ripple animation
const style = document.createElement('style');
style.textContent = `@keyframes ripple { to { transform: translate(-50%, -50%) scale(50); opacity: 0; } }`;
document.head.appendChild(style);
</script>
