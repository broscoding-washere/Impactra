<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDG Goals Learning Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-base:        #050807;
            --bg-surface:     #0a0e0c;
            --glass-bg:       rgba(12, 18, 15, 0.55);
            --glass-border:   rgba(110, 200, 170, 0.2);
            --blur-lg:        32px;
            --blur-md:        24px;
            --shadow-card:    0 20px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(110, 200, 170, 0.12);
            --shadow-glow:    0 0 40px rgba(95, 184, 146, 0.22), inset 0 1px 0 rgba(110, 200, 170, 0.15);
            --transition:     all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #050807 0%, #0a0e0c 55%, #070a08 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #e7f4ee;
            line-height: 1.6;
            cursor: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            background: rgba(167, 243, 208, 0.6);
            border: 2px solid rgba(167, 243, 208, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.15s ease, width 0.15s ease, height 0.15s ease;
            backdrop-filter: blur(8px);
        }

        .cursor.grow {
            transform: scale(1.8);
            width: 24px;
            height: 24px;
            background: rgba(167, 243, 208, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease-out;
        }

        .header h1 {
            font-size: 3.2rem;
            font-weight: 700;
            color: #e7f4ee;
            text-shadow: 0 10px 30px rgba(0,0,0,0.35);
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #c9f2de 0%, #7fcfb0 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 1.05rem;
            color: rgba(158,198,179,0.8);
            font-weight: 400;
            letter-spacing: 0.3px;
            opacity: 0.9;
        }

        .sdg-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
            gap: 28px;
            margin-bottom: 60px;
        }

        .sdg-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-lg)) saturate(160%) brightness(1.08);
            -webkit-backdrop-filter: blur(var(--blur-lg)) saturate(160%) brightness(1.08);
            border-radius: 28px;
            padding: 32px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--glass-border);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        

        .sdg-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #5fb892 0%, #7fd2b3 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sdg-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 28px 60px rgba(0, 0, 0, 0.5), 0 8px 18px rgba(95, 184, 146, 0.2);
            border-color: rgba(110, 200, 170, 0.45);
            background: rgba(16, 30, 24, 0.9);
        }

        .sdg-card:hover::before {
            opacity: 1;
        }

        .sdg-header {
            display: flex;
            align-items: flex-start;
            gap: 18px;
            margin-bottom: 20px;
        }

        .sdg-number {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #7fd2b3 0%, #5fb892 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            flex-shrink: 0;
            line-height: 1;
        }

        .sdg-title {
            font-size: 1.35rem;
            font-weight: 650;
            color: #e7f4ee;
            margin: 0;
            line-height: 1.3;
        }

        .sdg-description {
            color: rgba(158,198,179,0.78);
            font-size: 0.95rem;
            margin-bottom: 0;
            line-height: 1.7;
        }

        .quiz-section {
            background: rgba(15, 25, 21, 0.82);
            border-radius: 24px;
            padding: 50px 45px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(110, 200, 170, 0.18);
            margin: 0 auto 50px;
            max-width: 750px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(16px);
        }

        .quiz-section::before {
            content: '';
            position: absolute;
            top: 0;
            right: -100px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(95, 184, 146, 0.12) 0%, transparent 70%);
            border-radius: 50%;
        }

        .quiz-title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: #e7f4ee;
            margin-bottom: 32px;
            letter-spacing: -0.3px;
            position: relative;
            z-index: 1;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(167, 243, 208, 0.3);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 28px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #047857 0%, #059669 100%);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 8px;
        }

        .question-container {
            min-height: 300px;
        }

        .question {
            margin-bottom: 28px;
        }

        .question-number {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 650;
            color: #064e3b;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .option {
            padding: 18px 24px;
            border: 2px solid rgba(167, 243, 208, 0.4);
            border-radius: 14px;
            background: rgba(240, 253, 244, 0.8);
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
            user-select: none;
            color: #1a1a1a;
        }

        .option:hover {
            border-color: rgba(16, 185, 129, 0.6);
            background: rgba(209, 250, 229, 0.6);
            transform: translateX(6px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.1);
        }

        .option.selected {
            background: linear-gradient(135deg, #047857 0%, #059669 100%);
            color: white;
            border-color: #047857;
            font-weight: 600;
            box-shadow: 0 6px 16px rgba(4, 120, 87, 0.3);
        }

        .btn {
            background: linear-gradient(135deg, #7fd2b3 0%, #5fb892 100%);
            color: #0f1915;
            border: none;
            padding: 16px 40px;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 650;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
            box-shadow: 0 10px 28px rgba(95, 184, 146, 0.35);
            display: block;
            margin: 28px auto 0;
            width: 220px;
            letter-spacing: 0.2px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 16px 34px rgba(95, 184, 146, 0.45);
        }

        .btn:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .score {
            text-align: center;
            font-size: 2.8rem;
            font-weight: 700;
            margin: 35px 0;
            background: linear-gradient(135deg, #047857 0%, #059669 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .score-section {
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from { 
                opacity: 0; 
                transform: translateY(25px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        .fade-in-up {
            animation: fadeInUp 0.7s ease-out;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(4, 120, 87, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(4, 120, 87, 0.3);
            border-radius: 8px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(4, 120, 87, 0.5);
        }

        @media (max-width: 768px) {
            .container {
                padding: 28px 16px;
            }

            .header h1 { 
                font-size: 2.4rem;
                margin-bottom: 8px;
            }

            .header p {
                font-size: 1rem;
            }

            .sdg-grid { 
                grid-template-columns: 1fr;
                gap: 20px;
                margin-bottom: 40px;
            }

            .sdg-card {
                padding: 24px;
            }

            .quiz-section { 
                padding: 35px 24px;
                margin: 0 auto 35px;
            }

            .quiz-title {
                font-size: 1.8rem;
                margin-bottom: 24px;
            }

            .btn {
                width: 100%;
                padding: 15px 30px;
            }

            .header {
                margin-bottom: 40px;
            }
        }

        @media (max-width: 480px) {
            .header h1 { 
                font-size: 2rem;
            }

            .sdg-header {
                gap: 12px;
            }

            .sdg-number {
                font-size: 2.2rem;
            }

            .sdg-title {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="cursor" id="cursor"></div>

        <header class="header fade-in-up">
            <h1> Sustainable Development Goals</h1>
            <p>17 Global Goals to Transform Our World by 2030</p>
        </header>

        <div class="sdg-grid" id="sdgGrid"></div>

        <div class="quiz-section fade-in-up">
            <h2 class="quiz-title">Test Your SDG Knowledge</h2>
            <div class="button-container">
                <a href="quiz.html">
                    <button class="btn" id="startQuizBtn">Start Quiz</button>
                </a>
            </div>
        </div>
    </div>

    <script>
        // Custom Cursor
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // Hover effects 
        const hoverElements = document.querySelectorAll('.card, .cta-button');
        hoverElements.forEach(el => {
            el.addEventListener('mouseenter', () => cursor.classList.add('grow'));
            el.addEventListener('mouseleave', () => cursor.classList.remove('grow'));
        });

        document.addEventListener('click', (e) => {
            if (e.target.closest('nav a, .cta-button')) return; // Skip ripple on nav/CTA
            
            const ripple = document.createElement('div');
            ripple.style.cssText = `
                position: fixed;
                left: ${e.clientX}px;
                top: ${e.clientY}px;
                width: 10px;
                height: 10px;
                background: rgba(255, 255, 255, 0.6);
                border-radius: 50%;
                transform: translate(-50%, -50%);
                pointer-events: none;
                z-index: 9998;
                animation: ripple 0.6s ease-out forwards;
            `;
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });

        // Ripple
        const style = document.createElement('style');
        style.textContent = `@keyframes ripple { to { transform: translate(-50%, -50%) scale(50); opacity: 0; } }`;
        document.head.appendChild(style);

        const sdgGoals = [
            { number: 1, title: "No Poverty", description: "End poverty in all its forms everywhere. Approximately 736 million people live in extreme poverty (less than $1.90/day). SDG 1 aims to eradicate extreme poverty by 2030, implement social protection systems for all, and ensure equal rights to economic resources, basic services, technology, and markets." },
            { number: 2, title: "Zero Hunger", description: "End hunger, achieve food security, improve nutrition, and promote sustainable agriculture. 828 million people faced hunger in 2021. The goal addresses malnutrition, agricultural productivity, sustainable food systems, and resilient agricultural practices to double small-scale farmer productivity." },
            { number: 3, title: "Good Health and Well-being", description: "Ensure healthy lives and promote well-being for all at all ages. Reduce maternal mortality to less than 70 per 100,000 live births, end epidemics like AIDS/TB/malaria, reduce premature mortality from NCDs by 1/3, and achieve universal health coverage." },
            { number: 4, title: "Quality Education", description: "Ensure inclusive and equitable quality education and promote lifelong learning. Ensure all girls/boys complete free primary/secondary education, eliminate gender disparities, increase scholarships for developing countries, and build inclusive education facilities." },
            { number: 5, title: "Gender Equality", description: "Achieve gender equality and empower all women and girls. End discrimination, eliminate violence against women/girls, ensure equal participation in leadership, recognize unpaid care work, and ensure universal access to reproductive health and rights." },
            { number: 6, title: "Clean Water and Sanitation", description: "Ensure availability and sustainable management of water and sanitation. Achieve universal access to safe drinking water, sanitation/hygiene, improve water quality, increase water-use efficiency, and protect ecosystems through sustainable freshwater management." },
            { number: 7, title: "Affordable and Clean Energy", description: "Ensure access to affordable, reliable, sustainable, and modern energy. Increase renewable energy share, double energy efficiency improvement rate, enhance international cooperation for clean energy R&D, and expand energy infrastructure in developing countries." },
            { number: 8, title: "Decent Work and Economic Growth", description: "Promote sustained, inclusive economic growth, full productive employment, and decent work. Achieve 7% GDP growth in LDCs, create productive employment/SMEs, eradicate forced child labor, and promote safe working environments for all workers." },
            { number: 9, title: "Industry, Innovation and Infrastructure", description: "Build resilient infrastructure, promote inclusive industrialization, foster innovation. Develop quality infrastructure, increase industry's share of employment/GDP, upgrade infrastructure for sustainability, enhance scientific research, and support domestic technology development." },
            { number: 10, title: "Reduced Inequalities", description: "Reduce inequality within and among countries. Sustain income growth of bottom 40%, promote social/economic/political inclusion, ensure equal opportunity, adopt fiscal/monetary policies to reduce inequality, and regulate financial markets for stability." },
            { number: 11, title: "Sustainable Cities and Communities", description: "Make cities inclusive, safe, resilient, sustainable. Ensure access to adequate housing/transport, enhance inclusive urbanization, protect cultural/natural heritage, reduce disaster impact, reduce environmental impact of cities, provide universal access to green spaces." },
            { number: 12, title: "Responsible Consumption and Production", description: "Ensure sustainable consumption/production patterns. Implement 10-Year Framework on SCP, achieve sustainable management/efficient use of natural resources, reduce food waste, encourage companies to adopt sustainable practices, promote public procurement practices." },
            { number: 13, title: "Climate Action", description: "Take urgent action to combat climate change. Strengthen resilience/adaptive capacity to climate hazards, integrate climate measures into policies, improve education/awareness on climate mitigation, implement climate commitments under UNFCCC." },
            { number: 14, title: "Life Below Water", description: "Conserve and sustainably use oceans, seas, marine resources. Reduce marine pollution, protect marine ecosystems, minimize ocean acidification, regulate fishing effectively, conserve 10% coastal/marine areas, end illegal fishing/subsidies." },
            { number: 15, title: "Life on Land", description: "Protect terrestrial ecosystems, halt biodiversity loss, combat desertification. Ensure conservation of ecosystems/mountain forests, combat desertification, halt/reverse land degradation, prevent invasive species, integrate ecosystem/biodiversity values into planning." },
            { number: 16, title: "Peace, Justice and Strong Institutions", description: "Promote peaceful societies, provide access to justice, build effective institutions. Reduce violence, end abuse/trafficking/violence against children, promote rule of law, combat corruption/organized crime, develop effective accountable institutions." },
            { number: 17, title: "Partnerships for the Goals", description: "Strengthen means of implementation, revitalize global partnership. Enhance North-South/South-South cooperation, promote technology transfer, assist developing countries in capacity-building, enhance policy/policy coherence, multi-stakeholder partnerships." }
        ];

        document.addEventListener('DOMContentLoaded', init);

        function init() {
            createSDGGrid();
            startQuiz();
        }

        function createSDGGrid() {
            const grid = document.getElementById('sdgGrid');
            sdgGoals.forEach((goal) => {
                const card = document.createElement('div');
                card.className = 'sdg-card';
                const num = goal.number < 10 ? '0' + goal.number : goal.number;
                card.innerHTML = `
                    <div class="sdg-header">
                        <span class="sdg-number">${num}</span>
                        <h3 class="sdg-title">${goal.title}</h3>
                    </div>
                    <p class="sdg-description">${goal.description}</p>
                `;
                card.onclick = () => card.classList.toggle('expanded');
                grid.appendChild(card);
            });
        }

        
    </script>
</body>
</html>
