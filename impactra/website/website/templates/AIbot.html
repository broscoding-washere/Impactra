<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahul — Waste Helper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base:        #050807;
            --bg-surface:     #0a0e0c;
            --bg-elevated:    #0d1713;
            --bg-card:        #0f1916;
            --bg-input:       #0a0f0d;

            --green-deep:     #103524;
            --green-forest:   #1f5a40;
            --green-sage:     #5fb892;
            --green-mint:     #7fd2b3;
            --green-pale:     #c9f2de;

            --earth-amber:    #c9a84c;
            --earth-clay:     #8b5e3c;

            --text-primary:   #e7f4ee;
            --text-secondary: #9bb2a8;
            --text-muted:     #6f857b;
            --text-dim:       #4d6158;

            --border-subtle:  rgba(110, 200, 170, 0.15);
            --border-glow:    rgba(110, 200, 170, 0.35);
            --glass-bg:       rgba(12, 18, 15, 0.55);
            --glass-border:   rgba(127, 210, 179, 0.2);

            --bubble-user-bg: linear-gradient(135deg, rgba(31, 90, 64, 0.65), rgba(16, 53, 36, 0.65));
            --bubble-ai-bg:   rgba(13, 22, 18, 0.7);

            --shadow-heavy:   0 28px 70px rgba(0, 0, 0, 0.5);
            --shadow-card:    0 12px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(127, 210, 179, 0.12);
            --shadow-glow:    0 0 40px rgba(95, 184, 146, 0.22), inset 0 1px 0 rgba(110, 200, 170, 0.15);

            --blur-lg:        32px;
            --blur-md:        24px;
            --blur-sm:        16px;

            --font-ui:        'Outfit', sans-serif;
            --font-mono:      'DM Mono', monospace;
            --radius-md:      14px;
            --radius-lg:      20px;
            --radius-xl:      28px;
            --radius-bubble:  20px;
            --transition:     all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        *, *::before, *::after {
            margin: 0; padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            cursor: none !important;
        }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-base);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Ambient Background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 55% 50% at 10% 15%, rgba(45,106,79,0.2) 0%, transparent 70%),
                radial-gradient(ellipse 45% 55% at 90% 85%, rgba(26,71,49,0.25) 0%, transparent 70%),
                radial-gradient(ellipse 35% 25% at 50% 50%, rgba(82,183,136,0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(82,183,136,0.022) 1px, transparent 1px),
                linear-gradient(90deg, rgba(82,183,136,0.022) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
        }

        /* Custom Cursor */
        .cursor {
            position: fixed;
            width: 18px;
            height: 18px;
            border: 2px solid var(--green-sage);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.2s ease, height 0.2s ease, background 0.2s ease, border-color 0.2s ease;
            backdrop-filter: invert(0.06);
        }
        .cursor.clicking {
            width: 12px; height: 12px;
            background: rgba(82,183,136,0.3);
        }

        /*Main Container */
        .container {
            width: 100%;
            max-width: 760px;
            height: min(88vh, 780px);
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-heavy), 0 0 0 1px rgba(82,183,136,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 1;
            animation: riseUp 0.65s cubic-bezier(0.22,1,0.36,1) both;
        }

        /* Top edge accent */
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 5%, var(--green-sage) 40%, var(--earth-amber) 60%, transparent 95%);
            opacity: 0.45;
            z-index: 2;
        }

        /* Header*/
        .header {
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border-subtle);
            padding: 22px 28px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 28px; right: 28px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-glow), transparent);
        }

        .avatar-wrap {
            position: relative;
            flex-shrink: 0;
        }

        .avatar {
            width: 48px; height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--green-forest) 0%, var(--green-deep) 100%);
            border: 2px solid var(--border-glow);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem;
            box-shadow: 0 0 20px rgba(45,106,79,0.4);
        }

        .status-dot {
            position: absolute;
            bottom: 2px; right: 2px;
            width: 11px; height: 11px;
            border-radius: 50%;
            background: var(--green-sage);
            border: 2px solid var(--bg-elevated);
            box-shadow: 0 0 8px var(--green-sage);
            animation: pulse 2.5s ease-in-out infinite;
        }

        .header-info {
            flex: 1;
        }

        .header-info h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
            line-height: 1.2;
        }

        .header-info p {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
            margin-top: 2px;
        }

        .header-badge {
            background: rgba(82,183,136,0.08);
            border: 1px solid rgba(82,183,136,0.18);
            color: var(--green-sage);
            font-size: 0.67rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 50px;
            font-family: var(--font-mono);
            white-space: nowrap;
        }

        /* Chat Area */
        .chat-box {
            flex: 1;
            padding: 24px 24px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        /* Scrollbar */
        .chat-box::-webkit-scrollbar {
            width: 4px;
        }
        .chat-box::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: var(--text-dim);
            border-radius: 4px;
        }

        /* Messages */
        .message {
            max-width: 72%;
            padding: 13px 17px;
            border-radius: var(--radius-bubble);
            font-size: 0.92rem;
            line-height: 1.6;
            font-weight: 400;
            animation: slideIn 0.35s cubic-bezier(0.22,1,0.36,1) both;
            word-break: break-word;
        }

        .user-message {
            background: var(--bubble-user-bg);
            color: var(--green-pale);
            margin-left: auto;
            border-bottom-right-radius: 5px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3), 0 0 0 1px rgba(82,183,136,0.12);
        }

        .ai-message {
            background: var(--bubble-ai-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
            position: relative;
            padding-left: 20px;
        }

        
        .ai-message::before {
            content: '';
            position: absolute;
            left: 0; top: 20%; bottom: 20%;
            width: 3px;
            border-radius: 0 3px 3px 0;
            background: linear-gradient(180deg, var(--green-sage), var(--earth-amber));
            opacity: 0.6;
        }

        
        .typing {
            background: var(--bubble-ai-bg);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            font-size: 0.82rem;
            font-family: var(--font-mono);
            border-bottom-left-radius: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            max-width: 72%;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }
        .typing-dots span {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--green-sage);
            animation: dotBounce 1.2s ease-in-out infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        /*Input Area */
        .input-area {
            padding: 16px 20px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid var(--border-subtle);
            background: var(--bg-elevated);
            flex-shrink: 0;
        }

        #userInput {
            flex: 1;
            padding: 13px 20px;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: 50px;
            font-size: 0.92rem;
            font-family: var(--font-ui);
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            caret-color: var(--green-sage);
        }

        #userInput::placeholder {
            color: var(--text-muted);
        }

        #userInput:focus {
            border-color: var(--border-glow);
            box-shadow: 0 0 0 3px rgba(82,183,136,0.08), 0 0 16px rgba(82,183,136,0.06);
        }

        #sendBtn {
            width: 46px; height: 46px;
            background: linear-gradient(135deg, var(--green-forest), var(--green-deep));
            border: 1px solid var(--border-glow);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: none;
            font-size: 1rem;
            transition: all 0.25s cubic-bezier(0.34,1.4,0.64,1);
            box-shadow: 0 4px 16px rgba(0,0,0,0.3), 0 0 12px rgba(45,106,79,0.3);
            flex-shrink: 0;
            color: var(--green-mint);
        }

        #sendBtn:hover {
            background: linear-gradient(135deg, var(--green-sage), var(--green-forest));
            transform: scale(1.1);
            box-shadow: 0 6px 24px rgba(0,0,0,0.4), 0 0 20px rgba(82,183,136,0.3);
            border-color: rgba(149,213,178,0.4);
        }

        #sendBtn:active {
            transform: scale(0.95);
        }

        /* Animations */
        @keyframes riseUp {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(12px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--green-sage); }
            50%       { opacity: 0.5; box-shadow: 0 0 4px var(--green-sage); }
        }

        @keyframes dotBounce {
            0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
            40%            { transform: scale(1);   opacity: 1; }
        }

        /* Responsive  */
        @media (max-width: 560px) {
            body { padding: 0; align-items: stretch; }
            .container {
                height: 100vh;
                max-width: 100%;
                border-radius: 0;
                border: none;
            }
            .header { padding: 16px 18px; }
            .chat-box { padding: 16px 14px 12px; }
            .input-area { padding: 12px 14px 16px; }
            .header-badge { display: none; }
            .message { max-width: 86%; }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Header -->
    <div class="header">
        <div class="avatar-wrap">
            <div class="avatar">WM</div>
            <div class="status-dot"></div>
        </div>
        <div class="header-info">
            <h1>Rahul</h1>
            <p>Waste Management Assistant</p>
        </div>
        <div class="header-badge">Online</div>
    </div>

    <!-- Chat -->
    <div class="chat-box" id="chatBox"></div>

    <!-- Input -->
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask about waste management…">
        <button id="sendBtn" aria-label="Send">
            ➤
        </button>
    </div>

</div>

<script>
    // Custom Cursor
    const cursor = document.createElement('div');
    cursor.className = 'cursor';
    document.body.appendChild(cursor);

    document.addEventListener('mousemove', e => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top  = e.clientY + 'px';
    });

    document.addEventListener('mousedown', () => cursor.classList.add('clicking'));
    document.addEventListener('mouseup',   () => cursor.classList.remove('clicking'));

    //Chat Setup
    const chatBox   = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn   = document.getElementById('sendBtn');

    // Welcome message
    setTimeout(() => {
        addMessage('ai', 'Namaskar! Ask me anything about waste management or the app.');
    }, 800);

    sendBtn.onclick         = sendMessage;
    userInput.onkeypress    = e => { if (e.key === 'Enter') sendMessage(); };

    function sendMessage() {
        const msg = userInput.value.trim();
        if (!msg) return;

        addMessage('user', msg);
        userInput.value = '';

       
        const typing = document.createElement('div');
        typing.className = 'message typing';
        typing.innerHTML = `
            <span>Rahul is thinking</span>
            <div class="typing-dots">
                <span></span><span></span><span></span>
            </div>`;
        chatBox.appendChild(typing);
        chatBox.scrollTop = chatBox.scrollHeight;

        setTimeout(() => {
            typing.remove();
            const res = getAIResponse(msg.toLowerCase());
            addMessage('ai', res);
        }, 1000);
    }

    function addMessage(type, text) {
        const div = document.createElement('div');
        div.className = `message ${type}-message`;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // AI dataset
    function getAIResponse(q) {
        if (q.includes('hi') || q.includes('hello'))
            return 'Namaskar! Ask me about recycling, plastic, composting, SDG goals, or waste management.';

        if (q.includes('recycle'))
            return 'Recycle clean materials like paper, metal, and some plastics. Always wash items before recycling.';

        if (q.includes('what is sdg') || q.includes('sustainable development goals') || q.includes('sdgs') || q.includes('what are sustainable development goals'))
            return 'The SDGs are 17 global goals set by the UN to achieve a better and more sustainable future for all by 2030.';

        if (q.includes('plastic'))
            return 'Avoid single-use plastics. Use cloth bags and reusable bottles. Plastic harms animals and oceans.';

        if (q.includes('compost') || q.includes('organic'))
            return 'Compost kitchen waste like peels and leaves. No meat or dairy. It turns into natural fertilizer.';

        if (q.includes('e-waste') || q.includes('battery') || q.includes('phone'))
            return 'E-waste is dangerous. Never throw electronics in dustbins. Give them to certified recyclers.';
        
        if (q.includes('what is impactra?') || q.includes('impactra'))
            return 'Impactra is a waste management app that helps you learn about recycling, composting, and reducing waste. It also connects you with local recycling centers and tracks your impact on the environment It gives you a good opportunity to earn gifts aswell!';

        if (q.includes('glass'))
            return 'Glass is fully recyclable. Keep it clean and don\'t mix broken glass with regular waste.';

        if (q.includes('metal'))
            return 'Metals like cans and scrap can be recycled again and again. Clean them before disposal.';

        if (q.includes('paper'))
            return 'Paper can be recycled if dry and clean. Wet or oily paper should go in organic waste.';

        if (q.includes('reduce') || q.includes('less waste'))
            return 'Reduce waste by reusing items, avoiding packaging, and buying only what you need.';

        if (q.includes('reuse'))
            return 'Reuse bottles, clothes, and containers instead of throwing them away.';

        if (q.includes('segregate') || q.includes('separate'))
            return 'Separate waste into Wet, Dry, and Hazardous for proper disposal.';

        if (q.includes('hazardous'))
            return 'Hazardous waste includes batteries, chemicals, and e-waste. Handle with care and dispose at designated centers.';

        if (q.includes('glass-waste'))
            return 'Glass waste should be kept separate and taken to recycling centers. Avoid mixing with regular trash.';
        
        if (q.includes('organic-waste'))
            return 'Organic waste includes food scraps and garden waste. It can be composted to enrich soil.';

        if (q.includes('metal-waste'))
            return 'Metal waste like cans and scrap can be recycled. Clean them before disposal to ensure they are processed correctly.';

        if (q.includes('plastic-waste'))
            return 'Plastic waste should be minimized and properly disposed of. Use reusable alternatives when possible.';
        
        if (q.includes('paper-waste'))
            return 'Paper waste can be recycled if it is clean and dry. Wet or contaminated paper should be disposed of in organic waste.';

        if (q.includes('reuse'))
            return 'Reuse bottles, clothes, and containers instead of throwing them away.';

        if (q.includes('reduce'))
            return 'Reduce waste by reusing items, avoiding packaging, and buying only what you need.';

        if (q.includes('sdg-1'))
            return 'SDG 1 aims to end poverty. Proper waste management creates jobs and supports livelihoods, helping to reduce poverty.';

        if (q.includes('sdg-2'))
            return 'SDG 2 aims to end hunger and promote sustainable agriculture. Proper waste management can help reduce food waste and support local food systems.';
        
        if (q.includes('sdg-3'))
            return 'SDG 3 focuses on good health and well-being. Proper waste management reduces pollution and prevents disease, promoting healthier communities.'; 

        if (q.includes('sdg-4'))
            return 'SDG 4 promotes quality education. Educating communities about waste management fosters environmental stewardship and sustainable practices.';

        if (q.includes('sdg-5'))
            return 'SDG 5 aims for gender equality. Waste management can empower women and marginalized communities.';

        if (q.includes('sdg-6'))
            return 'SDG 6 ensures clean water and sanitation. Proper waste management prevents water pollution and protects aquatic ecosystems.';

        if (q.includes('sdg-7'))
            return 'SDG 7 promotes affordable and clean energy. Proper waste management can support renewable energy through waste-to-energy technologies.';

        if (q.includes('sdg-8'))
            return 'SDG 8 promotes decent work and economic growth. Waste management creates jobs in recycling, composting, and waste collection industries.';

        if (q.includes('sdg-9'))
            return 'SDG 9 focuses on industry, innovation, and infrastructure. Proper waste management encourages sustainable industrial practices and innovation in recycling technologies.';

        if (q.includes('sdg-10'))
            return 'SDG 10 aims to reduce inequalities. Proper waste management can provide economic opportunities for marginalized communities and promote social inclusion.';

        if (q.includes('sdg-11'))
            return 'SDG 11 promotes sustainable cities and communities. Proper waste management reduces pollution and creates cleaner, healthier urban environments.';

        if (q.includes('sdg-12'))
            return 'SDG 12 ensures responsible consumption and production. Proper waste management promotes sustainable consumption patterns and reduces environmental impact.';

        if (q.includes('sdg-13'))
            return 'SDG 13 focuses on climate action. Proper waste management reduces greenhouse gas emissions and mitigates climate change impacts.';

        if (q.includes('sdg-14'))
            return 'SDG 14 promotes life below water. Proper waste management prevents marine pollution and protects aquatic ecosystems.';

        if (q.includes('sdg-15'))
            return 'SDG 15 focuses on life on land. Proper waste management prevents land degradation and protects terrestrial ecosystems.';

        if (q.includes('sdg-16'))
            return 'SDG 16 promotes peace, justice, and strong institutions. Proper waste management can reduce conflicts over resources and promote social cohesion.';

        if (q.includes('sdg-17'))
            return 'SDG 17 focuses on partnerships for the goals. Proper waste management requires collaboration between governments, businesses, and communities to achieve sustainable development.';
        

        if (q.includes('pollution'))
            return 'Bad waste management causes pollution. Recycling and composting help protect the environment.';

        return 'Ask me about recycling, plastic, composting, e-waste, or reducing waste.';
    }
</script>

</body>
</html>
